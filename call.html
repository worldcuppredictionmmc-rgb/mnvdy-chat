<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8f4"><title>Video chat · mnvdy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f4;color:#171a18;font-family:'DM Sans',sans-serif;min-height:100dvh}.app{width:min(1200px,100%);min-height:100dvh;margin:auto;padding:0 24px;display:flex;flex-direction:column}.top{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font:700 22px 'Space Grotesk';letter-spacing:-1px}.brand b{color:#82b72f}.live{display:flex;align-items:center;gap:8px;font-size:12px;color:#687362}.dot{width:8px;height:8px;border-radius:50%;background:#9bd34b;box-shadow:0 0 0 4px #e7f3d8}.content{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;padding:10px 0 18px;min-height:0}.stage{position:relative;background:#eef4e8;border:1px solid #e1e9d9;border-radius:18px;overflow:hidden;min-height:360px;display:grid;place-items:center}.remote{width:100%;height:100%;position:absolute;inset:0;object-fit:cover;background:radial-gradient(ellipse at center,#e7f0dc,#f7f8f4 72%)}.waiting{position:absolute;z-index:1;text-align:center;max-width:330px;padding:24px;color:#303a2b}.waiting strong{display:block;font:600 20px 'Space Grotesk';margin-bottom:9px}.waiting span{font-size:13px;line-height:1.6;color:#737d6e}.local{position:absolute;z-index:2;right:16px;bottom:16px;width:clamp(120px,22%,230px);aspect-ratio:4/3;object-fit:cover;background:#e5eedc;border:2px solid white;border-radius:13px;box-shadow:0 8px 25px #25331825}.side{background:white;border:1px solid #e4e9df;border-radius:18px;box-shadow:0 10px 32px #2430180b;display:flex;flex-direction:column;min-height:0;padding:15px}.side-head{font:600 15px 'Space Grotesk';padding:2px 1px 13px;border-bottom:1px solid #e9ece5}.messages{flex:1;min-height:130px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:12px 1px}.bubble{max-width:90%;width:fit-content;background:#f0f5e9;color:#30392b;border-radius:11px;padding:9px 11px;font-size:12px;line-height:1.45;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#ddf3bd;color:#243019}.bubble.system{align-self:center;background:transparent;color:#7d8677;font-size:11px;text-align:center}.form{display:flex;gap:7px;padding-top:10px;border-top:1px solid #e9ece5}.form input{min-width:0;flex:1;background:#fff;border:1px solid #e0e6da;border-radius:9px;padding:10px;color:#171a18;font:13px 'DM Sans';outline:none}.form input:focus{border-color:#a7d74f;box-shadow:0 0 0 3px #e9f4dc}.form button{border:0;border-radius:9px;background:#c9fa5f;color:#18210f;font-size:16px;width:40px}.controls{display:flex;justify-content:center;align-items:center;gap:10px;padding:2px 0 max(18px,env(safe-area-inset-bottom))}.control{border:1px solid #dfe7d5;background:white;color:#394234;border-radius:10px;padding:11px 17px;font-size:12px;font-weight:700}.control:hover{background:#f0f6e8}.control.next{background:#c9fa5f;border-color:#c9fa5f;color:#17210f}.control.end{background:#edf4e5;border-color:#dfe9d4;color:#394b2c}.error{color:#ffb5a9}.hidden{display:none!important}@media(max-width:760px){.app{padding:0 13px}.top{height:58px}.content{grid-template-columns:1fr;grid-template-rows:minmax(240px,1fr) minmax(180px,30dvh);gap:10px;padding:4px 0 12px}.stage{min-height:240px}.side{padding:12px}.side-head{padding-bottom:9px}.messages{min-height:85px;padding:8px 1px}.form{padding-top:8px}.controls{padding-bottom:max(12px,env(safe-area-inset-bottom));gap:7px}.control{padding:10px 12px;font-size:11px}.local{right:10px;bottom:10px;width:112px}.waiting strong{font-size:17px}}@media(max-height:620px) and (min-width:761px){.top{height:52px}.content{padding:0 0 10px}.stage{min-height:0}.controls{padding-bottom:10px}}
</style>
</head>
<body><main class="app"><header class="top"><div class="brand">mnvdy <b>chat</b></div><div class="live"><i class="dot"></i><span id="status">Connecting…</span></div></header><section class="content"><div class="stage"><video class="remote" id="remote" autoplay playsinline></video><div class="waiting" id="waiting"><strong id="waitingTitle">Finding your person…</strong><span id="waitingCopy">Keep this window open while we find someone to meet.</span></div><video class="local" id="local" autoplay muted playsinline></video></div><aside class="side"><div class="side-head">Chat with your match</div><div class="messages" id="messages" aria-live="polite"></div><form class="form" id="form"><input id="message" maxlength="2000" autocomplete="off" placeholder="Write a message…" aria-label="Write a message"><button aria-label="Send">➤</button></form></aside></section><footer class="controls"><button class="control" data-action="report">Report</button><button class="control next" data-action="next">Next person ↗</button><button class="control end" data-action="cancel">End chat</button></footer></main>
<script>
const $=id=>document.getElementById(id);let latestMessages='';function send(action,text){if(window.opener&&!window.opener.closed)window.opener.postMessage({action,text},location.origin)}function renderMessages(items){const key=JSON.stringify(items||[]);if(key===latestMessages)return;latestMessages=key;$('messages').replaceChildren();for(const item of items||[]){const el=document.createElement('div');el.className='bubble '+(item.kind||'');el.textContent=item.text;$('messages').append(el)}$('messages').scrollTop=$('messages').scrollHeight}
function sync(){try{if(!window.opener||window.opener.closed){$('status').textContent='Call window disconnected';$('waitingTitle').textContent='Return to mnvdy chat';$('waitingCopy').textContent='The main chat window is no longer available.';return}const media=window.opener.__mnvdyGetCallMedia?.();if(media){if(media.local&&$('local').srcObject!==media.local)$('local').srcObject=media.local;if(media.remote&&$('remote').srcObject!==media.remote)$('remote').srcObject=media.remote;if(media.remote){$('remote').play().catch(()=>{});$('waiting').classList.add('hidden')}else $('waiting').classList.remove('hidden')}}catch{}}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==window.opener||e.data?.type!=='mnvdy-call-state')return;const state=e.data;renderMessages(state.messages);let status='Connecting…',title='Finding your person…',copy='Keep this window open while we find someone to meet.';if(state.status==='connected'&&state.matched){status='Connected';title='You’re connected';copy='Say hello and enjoy the conversation.'}else if(state.status==='partner-left'){status='Partner left';title='Your partner left';copy='Choose Next person to find another match, or end the chat.'}else if(state.status==='video-failed'){status='Video issue';title='Video could not connect';copy='You can keep texting, or choose Next person to try again.'}else if(state.status==='reported'){status='Report sent';title='Thanks for letting us know';copy='Your report has been recorded.'}else if(state.status==='connection-lost'){status='Connection lost';title='Server disconnected';copy='Close this window and try again from mnvdy chat.'}else if(typeof state.status==='string'&&state.status!=='connecting')copy=state.status;$('status').textContent=status;$('waitingTitle').textContent=title;$('waitingCopy').textContent=copy;if(state.matched&&state.status==='connected'&&window.opener.__mnvdyGetCallMedia()?.remote)$('waiting').classList.add('hidden');else $('waiting').classList.remove('hidden')});
document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>{send(button.dataset.action);if(button.dataset.action==='cancel')window.close()}));$('form').addEventListener('submit',e=>{e.preventDefault();const text=$('message').value.trim();if(!text)return;send('message',text);$('message').value=''});window.addEventListener('beforeunload',()=>{if(window.opener&&!window.opener.closed)send('cancel')});if(window.opener&&!window.opener.closed)window.opener.postMessage({type:'mnvdy-call-ready'},location.origin);setInterval(sync,400);sync();
</script></body></html>
